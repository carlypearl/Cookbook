<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookbook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ORANGES BAND -->
  <div class="topbar"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="header__left">
      <span class="mono" id="headerCount">Recipes 0</span>
    </div>

          <!-- between '> <' text can be inserted so it shows on top -->
    <div class="header__center">
      <a href="#" class="logo"> <span class="logo__star"> </span></a>
    </div>

    <div class="header__right">
      <button class="btn-random" id="randomBtn" type="button">Random Recipe</button>
    </div>
  </header>

  <!-- HERO -->
            <!-- before and after <span class="dotted"> text can be inserted so it shows on top right side -->
  <section class="hero">
    <h1 class="hero__title">Cookbook</h1>
    <p class="hero__text">
       <span class="dotted"></span>
    </p>
  </section>

  <!-- Content -->
  <main class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="filters" id="categoryList"><!-- via JS --></nav>

      <div class="search">
        <label class="search__label mono" for="searchInput">Search ingredient</label>
        <input
          type="text"
          id="searchInput"
          class="search__input mono"
          placeholder="e.g. Pumpkin"
          autocomplete="off">
        <button type="button" class="search__clear mono" id="searchClear" hidden>Clear</button>
      </div>
    </aside>

    <!-- GRID -->
    <section class="grid-wrap">
      <div class="grid" id="recipeGrid"><!-- via JS --></div>
      <p class="empty mono" id="emptyState" hidden>No recipes found.</p>
    </section>

  </main>

  <footer class="footer mono">
    <span>Carly's cookbook *</span>
    <span id="footerCount"></span>
  </footer>

  <!-- DETAIL-MODAL -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>

    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close mono" type="button" data-close aria-label="Schließen">Close ×</button>

      <div class="modal__media">
        <img id="modalImg" src="" alt="">
      </div>

      <div class="modal__body">
        <span class="card__cat mono" id="modalCat"></span>
        <h2 class="modal__title" id="modalTitle"></h2>
        <p class="modal__meta mono" id="modalMeta"></p>

        <h3 class="modal__h3 mono">Ingredients</h3>
        <ul class="modal__ingredients mono" id="modalIngredients"></ul>

        <h3 class="modal__h3 mono">Preparation</h3>
        <ol class="modal__steps" id="modalSteps"></ol>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
